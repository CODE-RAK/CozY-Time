<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Time</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1d16;--bg2:#5a3a28;--card:rgba(255,235,215,.07);--line:rgba(255,235,215,.15);--text:#f8e8d6;--muted:#c9ab92;--accent:#e9a86b;--on:#2b1d16;--trk:rgba(255,235,215,.12);--stx:#7be4f2;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=sage]{--bg:#e6eddf;--bg2:#bfd4b6;--card:rgba(255,255,255,.55);--line:rgba(60,90,55,.18);--text:#2f4030;--muted:#65795f;--accent:#5a8a55;--on:#fff;--trk:rgba(60,90,55,.14);--stx:#0a0a0a;color-scheme:light}
:root[data-theme=dusk]{--bg:#16122a;--bg2:#3a2d70;--card:rgba(200,190,255,.08);--line:rgba(200,190,255,.17);--text:#ece8ff;--muted:#a9a0d6;--accent:#a78bfa;--on:#16122a;--trk:rgba(200,190,255,.13);--stx:#8ceafc;color-scheme:dark}
:root[data-theme=peach]{--bg:#fff0e6;--bg2:#ffcfba;--card:rgba(255,255,255,.6);--line:rgba(190,100,70,.2);--text:#4a2a22;--muted:#94624f;--accent:#e8694b;--on:#fff;--trk:rgba(190,100,70,.14);--stx:#0a0a0a;color-scheme:light}
:root[data-theme=ocean]{--bg:#0b2830;--bg2:#17606e;--card:rgba(190,240,250,.08);--line:rgba(190,240,250,.18);--text:#e3f8fb;--muted:#8fc4cd;--accent:#5fd0e0;--on:#0b2229;--trk:rgba(190,240,250,.13);--stx:#9ff4ff;color-scheme:dark}
:root[data-theme=diwali]{--bg:#1f0a1c;--bg2:#6e1b3c;--card:rgba(255,200,120,.08);--line:rgba(255,190,100,.22);--text:#ffeccf;--muted:#e3b67f;--accent:#ffb02e;--on:#2a0f1f;--trk:rgba(255,190,100,.15);--stx:#7be4f2;color-scheme:dark}
:root[data-theme=xmas]{--bg:#0d291e;--bg2:#21603f;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);--text:#fbf3e6;--muted:#a9cdb6;--accent:#ff5a5f;--on:#2a0608;--trk:rgba(255,255,255,.12);--stx:#8ff0f5;color-scheme:dark}
:root[data-theme=sakura]{--bg:#1a1030;--bg2:#4a2a5e;--card:rgba(28,12,48,.58);--line:rgba(255,200,230,.24);--text:#fff0f6;--muted:#ecbfd6;--accent:#ff8fb8;--on:#2a0f22;--trk:rgba(255,200,230,.15);--stx:#7be4f2;color-scheme:dark}
:root[data-theme=neon]{--bg:#0b0620;--bg2:#3b0f5c;--card:rgba(14,6,38,.62);--line:rgba(80,240,255,.28);--text:#eafcff;--muted:#a9b8ea;--accent:#ff4fe3;--on:#1a0624;--trk:rgba(120,200,255,.14);--stx:#7df3ff;color-scheme:dark}
:root[data-theme=festival]{--bg:#07142e;--bg2:#1d3b78;--card:rgba(8,20,48,.58);--line:rgba(255,220,160,.24);--text:#fff4e0;--muted:#dac9a4;--accent:#ffb347;--on:#1a1000;--trk:rgba(255,220,160,.14);--stx:#7be4f2;color-scheme:dark}
:root[data-theme=forest]{--bg:#0c2420;--bg2:#1f6659;--card:rgba(5,30,26,.58);--line:rgba(190,255,230,.22);--text:#e8fff6;--muted:#a3d8c6;--accent:#7ef0c3;--on:#06201a;--trk:rgba(190,255,230,.14);--stx:#7be4f2;color-scheme:dark}
:root[data-theme=sunset]{--bg:#ffd9c4;--bg2:#ff9a7a;--card:rgba(255,246,238,.68);--line:rgba(120,40,70,.22);--text:#3a1a2e;--muted:#855068;--accent:#d93a6a;--on:#fff;--trk:rgba(120,40,70,.12);--stx:#0a0a0a;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:radial-gradient(120% 90% at 20% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 16px 28px;overflow-x:hidden;overflow-y:auto;transition:background-color .6s}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;background:var(--accent);pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:320px;height:320px;top:-80px;right:-60px}.b2{width:260px;height:260px;bottom:-60px;left:-70px;animation-delay:-9s}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.12)}}
header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;position:relative}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.sw{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:164px}
header{flex-wrap:wrap;gap:10px}.brand{display:flex;align-items:center;gap:8px}.logo{width:32px;height:32px;color:var(--accent);flex:none}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;display:none}
:root[data-theme=xmas] .fx,:root[data-theme=diwali] .fx,:root[data-theme=sakura] .fx,:root[data-theme=forest] .fx{display:block}
:root[data-theme=sakura] .fx i{top:-10px;background:#ffc2da;animation:fall linear infinite}
:root[data-theme=forest] .fx i{bottom:-10px;background:#b8ffd9;box-shadow:0 0 10px 3px #5effb0;animation:rise linear infinite}
.art{position:fixed;inset:0;background-size:cover;background-position:center bottom;background-repeat:no-repeat;opacity:0;transition:opacity .7s;pointer-events:none}.art.on{opacity:1}.art.on~.blob{opacity:.1}
.fx i{position:absolute;border-radius:50%;opacity:0}
:root[data-theme=xmas] .fx i{top:-10px;background:#fff;animation:fall linear infinite}
:root[data-theme=diwali] .fx i{bottom:-10px;background:#ffc14d;box-shadow:0 0 8px 2px #ff9f1a;animation:rise linear infinite}
@keyframes fall{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(30px,105vh);opacity:.2}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(-30px,-105vh);opacity:0}}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline-offset:3px;transition:transform .2s}
.sw button:hover{transform:scale(1.15)}
.sw button[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
main{position:relative;width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:36px;padding:18px 18px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--trk)}
nav button{border:0;background:none;color:var(--muted);font:600 14px 'DM Sans',sans-serif;padding:10px;border-radius:999px;cursor:pointer;transition:.25s}
nav button[aria-selected=true]{background:var(--accent);color:var(--on)}
.panel{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:20px}
.panel[hidden]{display:none}
.dial{position:relative;width:min(280px,76vw);aspect-ratio:1}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.trk{fill:none;stroke:var(--trk);stroke-width:9}
.prg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--accent));transition:stroke-dashoffset .25s linear}
.read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.big{font-size:clamp(40px,12.5vw,58px);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.42em;color:var(--muted);letter-spacing:0}
.sub{color:var(--muted);font-size:14px;min-height:1.3em}
.dial.done{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{font:600 15px 'DM Sans',sans-serif;border:1px solid var(--line);background:var(--trk);color:var(--text);padding:12px 20px;border-radius:999px;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--on);border-color:transparent;min-width:120px;font-size:16px;padding:14px 26px;box-shadow:0 10px 24px -10px var(--accent)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.chip{padding:8px 14px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:transparent}
.laps{list-style:none;padding:0;width:100%;max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.laps li{display:flex;justify-content:space-between;padding:9px 14px;border-radius:14px;font-variant-numeric:tabular-nums;font-size:15px}
.laps li:nth-child(odd){background:var(--trk)}
.laps .best{color:var(--accent);font-weight:600}.laps .worst{color:var(--muted);text-decoration:line-through}
.hr{display:flex;align-items:center;gap:14px}.gear{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--trk);color:var(--text);cursor:pointer}
#set{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:16px}#set[hidden]{display:none}
.sheet{width:100%;max-width:400px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.shead{display:flex;justify-content:space-between;align-items:center}.shead h2{font:700 20px Fraunces,Georgia,serif}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);flex:1}.fld span{display:flex;justify-content:space-between}.fld b{color:var(--text)}
.sheet input[type=range]{accent-color:var(--accent);width:100%}.sheet input:not([type=range]):not([type=file]),.sheet select{font:500 15px 'DM Sans',sans-serif;color:var(--text);background:var(--trk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}.sheet input[type=file]{font:13px 'DM Sans',sans-serif;color:var(--muted)}
.two{display:flex;gap:10px}#sec-file,#sec-yt{display:flex;flex-direction:column;gap:14px}#sec-file[hidden],#sec-yt[hidden]{display:none}
.sheet,.sheet .fld,.sheet .fld b,.sheet .note,.sheet .shead h2,.sheet .btn.chip{color:var(--stx)}.sheet input:not([type=range]):not([type=file]),.sheet select,.sheet input[type=file]{color:var(--stx)}.sheet input::placeholder{color:var(--stx);opacity:.5}.sheet option{color:var(--stx);background:var(--bg)}.note{font-size:12px;color:var(--muted);line-height:1.5;min-height:1.5em}
#ringbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:30}#ringbar[hidden]{display:none}#yt iframe{width:240px;height:135px;border:0;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.custom{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.custom label{display:flex;align-items:baseline;gap:4px;color:var(--muted);font-size:13px}.custom input{width:58px;font:600 18px 'DM Sans',sans-serif;font-variant-numeric:tabular-nums;text-align:center;color:var(--text);background:var(--trk);border:1px solid var(--line);border-radius:14px;padding:9px 6px;-moz-appearance:textfield}.custom input::-webkit-outer-spin-button,.custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.custom input:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{font-size:12px;color:var(--muted);text-align:center;position:relative}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="art" aria-hidden="true"></div><div class="blob b1"></div><div class="blob b2"></div><div class="fx" aria-hidden="true"></div>
<header><div class="brand"><svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="28" cy="38" r="19"/><path d="M47 31h3a7 7 0 0 1 0 14h-3"/><path d="M28 38V28M28 38l7 4"/><path d="M21 15c-3-3 3-5 0-9M32 15c-3-3 3-5 0-9" stroke-width="3"/><circle cx="28" cy="38" r="1.5" fill="currentColor" stroke="none"/></svg>cozy time</div><div class="hr"><div class="sw" id="sw" role="group" aria-label="Theme"></div><button class="gear" data-act="settings" aria-label="Alarm settings" title="Alarm settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div></header>
<main>
  <nav role="tablist" aria-label="Mode">
    <button role="tab" data-tab="clock" aria-selected="true">Clock</button>
    <button role="tab" data-tab="stopwatch" aria-selected="false">Stopwatch</button>
    <button role="tab" data-tab="timer" aria-selected="false">Timer</button>
  </nav>

  <section class="panel" id="clock">
    <div class="dial"><div class="read"><div class="sub" id="cg"></div><div class="big" id="ct"></div><div class="sub" id="cd"></div></div></div>
    <div class="row"><button class="btn" data-act="fmt" id="fmtb">24-hour</button></div>
  </section>

  <section class="panel" id="stopwatch" hidden>
    <div class="dial"><div class="read"><div class="big" id="st">00:00<small>.00</small></div><div class="sub" id="sl">Ready when you are</div></div></div>
    <div class="row">
      <button class="btn" data-act="swreset">Reset</button>
      <button class="btn main" data-act="swgo" id="swgo">Start</button>
      <button class="btn" data-act="swlap" id="swlap" disabled>Lap</button>
    </div>
    <ul class="laps" id="laps"></ul>
  </section>

  <section class="panel" id="timer" hidden>
    <div class="dial" id="tdial"><div class="read"><div class="sub" id="tl">Focus time</div><div class="big" id="tt">25:00</div></div></div>
    <div class="row" id="chips"></div>
    <div class="custom" id="custom" role="group" aria-label="Custom time">
      <label><input type="number" id="ch" min="0" max="99" inputmode="numeric" value="0" aria-label="Hours"><span>h</span></label>
      <label><input type="number" id="cm" min="0" max="59" inputmode="numeric" value="25" aria-label="Minutes"><span>m</span></label>
      <label><input type="number" id="cs" min="0" max="59" inputmode="numeric" value="0" aria-label="Seconds"><span>s</span></label>
      <button class="btn chip" data-act="tmcustom">Set time</button>
    </div>
    <div class="row">
      <button class="btn chip" data-add="-60000">−1 min</button>
      <button class="btn chip" data-add="60000">+1 min</button>
      <button class="btn chip" data-add="30000">+30 sec</button>
    </div>
    <div class="row">
      <button class="btn" data-act="tmreset">Reset</button>
      <button class="btn main" data-act="tmgo" id="tmgo">Start</button>
    </div>
  </section>
</main>
<p class="hint">Space start/pause · L lap · R reset · 1–3 switch mode · T change theme</p>
<div id="set" hidden role="dialog" aria-modal="true" aria-labelledby="sett">
 <div class="sheet">
  <div class="shead"><h2 id="sett">Alarm settings</h2><button class="btn chip" data-act="closeset">Done</button></div>
  <label class="fld"><span>Language</span><select id="slang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></label>
  <label class="fld"><span>Clock time zone</span><select id="stz"></select></label>
  <label class="fld"><span>Volume <b id="svl">80%</b></span><input type="range" id="sv" min="0" max="100"></label>
  <label class="fld"><span>Ringtone</span><select id="sr"><option value="chime">Soft chime</option><option value="bell">Bright bell</option><option value="beep">Loud beeps</option><option value="file">My audio file</option></select></label>
  <div id="sec-file" hidden>
   <label class="fld"><span>Audio file</span><input type="file" id="sfile" accept="audio/*"></label>
   <div class="two"><label class="fld"><span>From</span><input id="sfs" placeholder="0:00"></label><label class="fld"><span>To</span><input id="sfe" placeholder="0:30"></label></div>
  </div>
  
  <p class="note" id="smsg"></p>
  <button class="btn main" data-act="testring" id="testbtn">Test sound</button>
  <button class="btn chip" data-act="wipe" id="wipebtn">Clear saved data</button>
 </div>
</div>
<div id="ringbar" hidden><div id="yt"></div><button class="btn main" data-act="stopring">Stop alarm</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],p2=n=>String(n).padStart(2,'0');
const C=2*Math.PI*118;
$$('.dial').forEach(d=>d.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 260 260" aria-hidden="true"><circle class="trk" cx="130" cy="130" r="118"/><circle class="prg" cx="130" cy="130" r="118" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>`));
const ring=(id,f)=>{$('#'+id+' .prg').style.strokeDashoffset=C*(1-Math.min(1,Math.max(0,f)))};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* anime-inspired scenery (original vector art) */
const S=b=>`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' preserveAspectRatio='xMidYMax slice'>${b}</svg>`;
const ART={

function setArt(id){const a=$('.art'),s=ART[id];if(s){a.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(s)}")`;a.classList.add('on')}else a.classList.remove('on')}
/* themes */
const THEMES=[['cocoa','Cozy Cocoa','#e9a86b'],['sage','Sage Garden','#5a8a55'],['dusk','Lavender Dusk','#a78bfa'],['peach','Peach Glow','#e8694b'],['ocean','Ocean Mist','#5fd0e0'],['diwali','Diwali Glow','#ffb02e'],['xmas','Christmas Eve','#ff5a5f'],['sakura','Sakura Night','#ff8fb8'],['neon','Neon Tokyo','#ff4fe3'],['festival','Summer Festival','#ffb347'],['forest','Spirit Forest','#7ef0c3'],['sunset','Sunset Rooftop','#d93a6a']];

$('#sw').innerHTML=THEMES.map(t=>`<button data-t="${t[0]}" style="background:${t[2]}" title="${t[1]}" aria-label="${t[1]}" aria-pressed="false"></button>`).join('');
$('#sw').onclick=e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)};
setTheme(theme);
$('.fx').innerHTML=Array.from({length:26},()=>{const s=2+Math.random()*4;return `<i style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*14}s"></i>`}).join('');

$('nav').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};

/* sound */
let ctx,master;const audio=()=>{try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();const c=ctx.createDynamicsCompressor();c.threshold.value=-10;c.ratio.value=8;master.connect(c);c.connect(ctx.destination)}ctx.resume()}catch(e){}};
const TONES={chime:{n:[659,784,988],w:'sine',g:.5,d:.8,s:.4},bell:{n:[1047,1319,1568,1319,1047],w:'triangle',g:.55,d:.7,s:.28},beep:{n:[1000,0,1000,0,1000],w:'square',g:.3,d:.15,s:.2}};
let srcs=[],ringT,autoT,ringOn=false;
function playTone(k){const T=TONES[k]||TONES.chime;T.n.forEach((f,i)=>{if(!f)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*T.s;o.type=T.w;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(T.g,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+T.d);o.connect(g);g.connect(master);o.start(t);o.stop(t+T.d+.05);srcs.push(o)});return T.n.length*T.s}
function playFile(){const s=ctx.createBufferSource(),dur=fileBuf.duration,a=Math.min(cfg.fs,Math.max(0,dur-.2)),e=Math.min(dur,cfg.fe>cfg.fs?cfg.fe:a+30),d=Math.max(.2,e-a);s.buffer=fileBuf;s.connect(master);s.start(0,a,d);srcs.push(s);return d}
function stopRing(){clearInterval(ringT);clearTimeout(autoT);srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[];ringOn=false;$('#yt').innerHTML='';$('#ringbar').hidden=true;$('#testbtn').textContent='Test sound'}
function startRing(test){
  stopRing();audio();if(!ctx)return;ringOn=true;master.gain.value=cfg.vol/100*2;
  const mode=cfg.tone==='file'&&fileBuf?'file':'tone';let len=0;
  {const c=()=>mode==='file'?playFile():playTone(cfg.tone);len=c();if(!test)ringT=setInterval(c,(len+.7)*1000)}
  $('#ringbar').hidden=false;if(test)$('#testbtn').textContent='Stop test';
  autoT=setTimeout(stopRing,test?(len+.5)*1000:60000);
  if(!test&&navigator.vibrate)navigator.vibrate([300,150,300]);
}
function chime(){startRing(false)}

/* clock */
let h24=store.get('ct-24')==='1';
function clockR(){
  const d=zdate(),h=d.getHours();
  $('#ct').textContent=h24?`${p2(h)}:${p2(d.getMinutes())}`:`${h%12||12}:${p2(d.getMinutes())}`;
  $('#cg').textContent=h<5?'Still up?':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Winding down';
  $('#cd').textContent=d.toLocaleDateString(LOC[cfg.lang],{weekday:'long',month:'long',day:'numeric'})+(h24?'':(h<12?' · am':' · pm'));
  $('#cg').textContent+=cfg.tz?' · '+cfg.tz.split('/').pop().replace(/_/g,' '):'';
  $('#fmtb').textContent=h24?'12-hour':'24-hour';
  ring('clock',(d.getSeconds()*1000+d.getMilliseconds())/60000);
}

/* stopwatch */
const sw={run:false,t0:0,acc:0,laps:[],last:0};
const swNow=()=>sw.acc+(sw.run?performance.now()-sw.t0:0);
const fmt=t=>`${p2(Math.floor(t/60000))}:${p2(Math.floor(t/1000)%60)}.${p2(Math.floor(t%1000/10))}`;
function swR(){const t=swNow();$('#st').innerHTML=`${p2(Math.floor(t/60000))}:${p2(Math.floor(t/1000)%60)}<small>.${p2(Math.floor(t%1000/10))}</small>`;ring('stopwatch',(t%60000)/60000)}
function swGo(){audio();if(sw.run){sw.acc+=performance.now()-sw.t0;sw.run=false}else{sw.t0=performance.now();sw.run=true}
  $('#swgo').textContent=sw.run?'Pause':sw.acc?'Resume':'Start';$('#swlap').disabled=!sw.run;$('#sl').textContent=sw.run?`Lap ${sw.laps.length+1}`:'Paused'}
function swLap(){if(!sw.run)return;const t=swNow();sw.laps.push(t-sw.last);sw.last=t;lapsR();$('#sl').textContent=`Lap ${sw.laps.length+1}`}
function swReset(){sw.run=false;sw.acc=0;sw.laps=[];sw.last=0;$('#swgo').textContent='Start';$('#swlap').disabled=true;$('#sl').textContent='Ready when you are';lapsR();swR()}
function lapsR(){const L=sw.laps,mn=Math.min(...L),mx=Math.max(...L);
  $('#laps').innerHTML=L.map((l,i)=>`<li class="${L.length>2?(l===mn?'best':l===mx?'worst':''):''}"><span>Lap ${i+1}</span><span>${fmt(l)}</span></li>`).reverse().join('')}

/* timer */
const tm={total:25*60000,rem:25*60000,run:false,end:0,done:false};
const PRE=[5,10,25,45];
$('#chips').innerHTML=PRE.map(m=>`<button class="btn chip" data-pre="${m}" aria-pressed="${m===25}">${m} min</button>`).join('');
function tmFmt(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${p2(m)}:${p2(s%60)}`:`${p2(m)}:${p2(s%60)}`}
function tmR(){$('#tt').textContent=tmFmt(tm.rem);ring('timer',tm.total?tm.rem/tm.total:0);
  $('#tl').textContent=tm.done?'Time’s up — nice work':tm.run?'Counting down':tm.rem<tm.total?'Paused':'Focus time';
  $('#tdial').classList.toggle('done',tm.done);
  $$('[data-pre]').forEach(b=>b.setAttribute('aria-pressed',!tm.run&&tm.rem===tm.total&&+b.dataset.pre*60000===tm.total));
  $('#tmgo').textContent=tm.run?'Pause':tm.rem<tm.total&&!tm.done?'Resume':'Start';tmSync()}
function tmGo(){audio();if(tm.done){tmReset();return}
  if(tm.run){tm.rem=tm.end-performance.now();tm.run=false}else if(tm.rem>0){tm.end=performance.now()+tm.rem;tm.run=true}tmR()}
function tmReset(){stopRing();tm.run=false;tm.done=false;tm.rem=tm.total;tmR()}
function tmSet(ms){stopRing();tm.run=false;tm.done=false;tm.total=tm.rem=Math.max(1000,ms);tmR()}
function tmAdd(ms){if(tm.done)tmReset();const n=Math.max(5000,tm.total+ms),d=n-tm.total;tm.total=n;tm.rem+=d;if(tm.run)tm.end+=d;tmR()}
$('#chips').onclick=e=>{const b=e.target.closest('[data-pre]');if(b)tmSet(+b.dataset.pre*60000)};
const cin=['#ch','#cm','#cs'].map(s=>$(s));
function tmSync(){if(cin.includes(document.activeElement))return;const s=Math.round(tm.total/1000);cin[0].value=Math.floor(s/3600);cin[1].value=Math.floor(s%3600/60);cin[2].value=s%60}
function tmCustom(){const [h,m,s]=cin.map(i=>Math.max(0,parseInt(i.value)||0));const ms=((Math.min(h,99)*60+m)*60+s)*1000;if(ms<1000){cin[1].focus();return}tmSet(ms);cin.forEach(i=>i.blur());tmSync()}
$('#custom').onkeydown=e=>{if(e.key==='Enter')tmCustom()};

/* actions */
const acts={fmt(){h24=!h24;store.set('ct-24',h24?'1':'0');clockR()},swgo:swGo,swlap:swLap,swreset:swReset,tmgo:tmGo,tmreset:tmReset,tmcustom:tmCustom,settings:openSet,closeset(){$('#set').hidden=true},testring(){ringOn?stopRing():startRing(true)},stopring:stopRing,wipe};
document.body.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)acts[a.dataset.act]();const d=e.target.closest('[data-add]');if(d)tmAdd(+d.dataset.add)});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||!$('#set').hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();tab==='stopwatch'?swGo():tab==='timer'?tmGo():0}
  else if(k==='l'&&tab==='stopwatch')swLap();
  else if(k==='r'){tab==='stopwatch'?swReset():tab==='timer'?tmReset():0}
  else if('123'.includes(k)&&k)setTab(['clock','stopwatch','timer'][k-1]);
  else if(k==='t')setTheme(THEMES[(THEMES.findIndex(t=>t[0]===theme)+1)%THEMES.length][0]);

const LI={en:0,hi:1,es:2,fr:3,de:4},LOC={en:undefined,hi:'hi-IN',es:'es',fr:'fr',de:'de'},DICT=new Map(I18N.map(r=>[r[0],r]));

const T=s=>{const r=DICT.get(s);return r?r[LI[cfg.lang]]:s};
function tr(s){if(cfg.lang==='en')return s;const r=DICT.get(s);if(r)return r[LI[cfg.lang]];let m;
  if(s.includes(' · '))return s.split(' · ').map(tr).join(' · ');
  if(m=s.match(/^Lap (\d+)$/))return T('Lap')+' '+m[1];
  if(m=s.match(/^(\d+) min$/))return m[1]+' '+T('min');
  if(m=s.match(/^Device time zone( \(.*\))?$/))return T('Device time zone')+(m[1]||'');
  return s}
const skip=n=>{const p=n.parentNode&&n.parentNode.nodeName;return p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA'};
function trNode(n){if(skip(n))return;const cur=n.nodeValue;if(n.__tr!==undefined&&cur===n.__tr)return;const m=cur.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2]){n.__tr=cur;return}const out=m[1]+tr(m[2])+m[3];n.__en=cur;n.__tr=out;if(out!==cur)n.nodeValue=out}
function relang(){const w=document.createTreeWalker(document.documentElement,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(skip(n))continue;if(n.__en!==undefined&&n.nodeValue===n.__tr)n.nodeValue=n.__en;n.__tr=undefined;trNode(n)}
  $$('[title],[aria-label]').forEach(e=>['title','aria-label'].forEach(a=>{if(!e.hasAttribute(a))return;const k='__'+a;if(e[k]===undefined)e[k]=e.getAttribute(a);e.setAttribute(a,tr(e[k]))}));

/* loop */
function tick(){
  if(tm.run){tm.rem=tm.end-performance.now();if(tm.rem<=0){tm.rem=0;tm.run=false;tm.done=true;chime()}tmR()}
  clockR();swR();
  document.title=tm.run?`${tmFmt(tm.rem)} · Timer`:sw.run?`${fmt(swNow()).slice(0,5)} · Stopwatch`:'Cozy Time';
}

let wiped=false,wipeArm=0;
function persist(){if(wiped)return;const n=Date.now();store.set('ct-state',JSON.stringify({tab,sw:{run:sw.run,el:swNow(),laps:sw.laps,last:sw.last,at:n},tm:{total:tm.total,rem:tm.run?tm.end-performance.now():tm.rem,run:tm.run,done:tm.done,at:n}}))}
(function restore(){let s;try{s=JSON.parse(store.get('ct-state')||'null')}catch(e){}
  if(!s||!s.sw||!s.tm)return;const w=s.sw,t=s.tm,n=Date.now();
  sw.laps=Array.isArray(w.laps)?w.laps.filter(Number.isFinite):[];sw.last=+w.last||0;sw.run=!!w.run;sw.acc=(+w.el||0)+(w.run?Math.max(0,n-w.at):0);sw.t0=performance.now();
  tm.total=Math.max(1000,+t.total||25*60000);tm.done=!!t.done;tm.run=!!t.run;tm.rem=Math.max(0,(+t.rem||0)-(t.run?Math.max(0,n-t.at):0));
  if(tm.run){if(tm.rem<=0){tm.run=false;tm.done=true;tm.rem=0}else tm.end=performance.now()+tm.rem}
  if(!tm.run&&!tm.done&&tm.rem<=0)tm.rem=tm.total;
  $('#swgo').textContent=sw.run?'Pause':sw.acc?'Resume':'Start';$('#swlap').disabled=!sw.run;$('#sl').textContent=sw.run?`Lap ${sw.laps.length+1}`:sw.acc?'Paused':'Ready when you are';lapsR();
  if(['clock','stopwatch','timer'].includes(s.tab))setTab(s.tab);
})();
